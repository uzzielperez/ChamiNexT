[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[functions."interview-agent"]
  timeout = 26

[functions."code-run"]
  timeout = 20

[functions."ship-test-evaluator"]
  timeout = 26

[functions."studio-workspace"]
  timeout = 10

[functions."workspace-agent"]
  timeout = 26

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
